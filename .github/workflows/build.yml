name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Set immersive fullscreen
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          # Добавляем immersive и screenOrientation в <activity>
          sed -i 's|<activity|<activity android:immersive="true" android:screenOrientation="sensorLandscape"|' "$MF"
          # Показываем результат в логе для проверки
          echo "----- AndroidManifest.xml -----"
          cat "$MF"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: List APK files
        run: find android -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ksyusha-carrots-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
